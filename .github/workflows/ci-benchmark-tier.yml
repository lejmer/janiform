name: ci-benchmark-smoke-tier

on:
  workflow_dispatch:

jobs:
  scheduled-benchmark-smoke-workloads:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run benchmark smoke workloads
        run: |
          mkdir -p .artifacts/benchmark-tier
          cargo test -p janiform-governance-bench --test benchmark_scenario_catalog -- --nocapture | tee .artifacts/benchmark-tier/benchmark_scenario_catalog.log
          cargo test -p janiform-governance-bench --test oracle_pricer_risk_benchmark_harness -- --nocapture | tee .artifacts/benchmark-tier/oracle_pricer_risk_benchmark_harness.log
          cargo test -p janiform-governance --test performance_baseline_capture_and_storage -- --nocapture | tee .artifacts/benchmark-tier/performance_baseline_capture_and_storage.log
          cargo test -p janiform-governance --test regression_drift_attribution_reports -- --nocapture | tee .artifacts/benchmark-tier/regression_drift_attribution_reports.log

      - name: Build scenario and baseline links
        if: always()
        run: |
          python3 scripts/ci/write_benchmark_artifact_index.py \
            --output-dir .artifacts/benchmark-tier \
            --repository "${{ github.repository }}" \
            --git-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --scenario-path "tests/fixtures/benchmarks/benchmark_scenario_catalog.json" \
            --baseline-path "tests/fixtures/benchmarks/oracle_pricer_risk_performance_baseline_v1_1.json"

      - name: Publish benchmark smoke summary
        if: always()
        run: |
          cat .artifacts/benchmark-tier/benchmark_artifact_index.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scope: benchmark smoke validation for wiring, schema stability, and baseline artifact hooks" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workloads: \`benchmark_scenario_catalog\`, \`oracle_pricer_risk_benchmark_harness\`, \`performance_baseline_capture_and_storage\`, \`regression_drift_attribution_reports\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger policy: scheduled weekdays and manual dispatch only" >> "$GITHUB_STEP_SUMMARY"

      - name: Emit benchmark smoke failure context with links
        if: failure()
        run: |
          echo "Benchmark smoke workload failed. Scenario and baseline links:"
          cat .artifacts/benchmark-tier/benchmark_artifact_index.md

      - name: Upload benchmark smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-smoke-workload-artifacts
          path: .artifacts/benchmark-tier
          if-no-files-found: error

  real-data-seeded-runtime-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bootstrap real-data seeded runtime benchmark environment
        run: |
          TMPDIR=/tmp UV_CACHE_DIR=/tmp/uv bash ./scripts/bootstrap-linux.sh .venv-linux

      - name: Run real-data seeded runtime benchmark
        run: |
          mkdir -p .artifacts/real-data-seeded-runtime-benchmark
          PYTHONPATH=python:. .venv-linux/bin/python scripts/ci/run_real_data_seeded_runtime_benchmark.py \
            --fixture-path tests/fixtures/benchmarks/real_data_seeded_runtime_benchmark_fixture.json \
            --policy-path tests/fixtures/benchmarks/real_data_seeded_runtime_benchmark_policy.json \
            --baseline-path tests/fixtures/benchmarks/real_data_seeded_runtime_baseline_v1.json \
            --output-dir .artifacts/real-data-seeded-runtime-benchmark

      - name: Publish real-data seeded runtime benchmark summary
        if: always()
        run: |
          cat .artifacts/real-data-seeded-runtime-benchmark/real_data_seeded_runtime_benchmark_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Emit real-data seeded runtime benchmark failure context
        if: failure()
        run: |
          echo "Real-data seeded runtime benchmark failed."
          cat .artifacts/real-data-seeded-runtime-benchmark/real_data_seeded_runtime_benchmark_summary.md

      - name: Upload real-data seeded runtime benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-data-seeded-runtime-benchmark-artifacts
          path: .artifacts/real-data-seeded-runtime-benchmark
          if-no-files-found: error

  microbenchmark-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bootstrap microbenchmark environment
        run: |
          TMPDIR=/tmp UV_CACHE_DIR=/tmp/uv bash ./scripts/bootstrap-linux.sh .venv-linux

      - name: Run Rust microbenchmark discovery smoke
        run: |
          mkdir -p .artifacts/microbenchmark-smoke
          TMPDIR=/tmp cargo bench -p janiform-governance-bench --bench rust_microbenchmarks -- --list | tee .artifacts/microbenchmark-smoke/rust-bench-list.log

      - name: Run Python microbenchmark smoke
        run: |
          mkdir -p .artifacts/microbenchmark-smoke
          PYTHONPATH=python:. .venv-linux/bin/pytest --benchmark-disable benches/python/test_microbenchmark_tooling.py benches/python/python_microbenchmarks.py | tee .artifacts/microbenchmark-smoke/python-microbench-smoke.log

      - name: Publish microbenchmark smoke summary
        if: always()
        run: |
          echo "## Microbenchmark Smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scope: Criterion bench discovery plus pytest-benchmark suite wiring" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger policy: manual dispatch only" >> "$GITHUB_STEP_SUMMARY"
          echo "- Merge policy: informative smoke only, not a required timing gate" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload microbenchmark smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: microbenchmark-smoke-artifacts
          path: .artifacts/microbenchmark-smoke
          if-no-files-found: error
