name: release-candidate

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release candidate tag name, like vX.Y.Z-rc.1
        required: true
        type: string
      target_ref:
        description: Git ref to cut the release candidate from
        required: false
        default: develop
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      workspace_version: ${{ steps.workspace-version.outputs.workspace_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_ref }}

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate release candidate tag against workspace version
        id: workspace-version
        shell: bash
        run: |
          workspace_version="$(
            python3 - <<'PY'
            from pathlib import Path
            import tomllib

            cargo_document = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
            print(cargo_document["workspace"]["package"]["version"])
            PY
          )"

          case "${{ inputs.tag_name }}" in
            v"${workspace_version}"*) ;;
            *)
              echo "tag '${{ inputs.tag_name }}' must start with v${workspace_version}"
              exit 1
              ;;
          esac

          echo "workspace_version=${workspace_version}" >> "$GITHUB_OUTPUT"

  linux-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs:
      - release-metadata
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bootstrap Linux environment
        run: ./scripts/bootstrap-linux.sh .venv-linux

      - name: Build Linux environment
        run: ./scripts/build-linux.sh .venv-linux

      - name: Run Linux verification
        run: |
          ./scripts/test-rust-linux.sh .venv-linux
          ./scripts/test-python-linux.sh .venv-linux
          ./.venv-linux/bin/python scripts/generate_crate_readmes.py --check
          ./.venv-linux/bin/python scripts/generate_internal_crate_graph_policy.py --check
          ./.venv-linux/bin/python scripts/generate_third_party_notices.py --check

      - name: Build Linux wheel artifacts
        run: ./.venv-linux/bin/python -m maturin build --release --out dist

      - name: Upload Linux release candidate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-linux-dist
          path: dist
          if-no-files-found: error

  windows-release-candidate:
    runs-on: windows-latest
    timeout-minutes: 120
    needs:
      - release-metadata
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bootstrap Windows environment
        shell: pwsh
        run: ./scripts/bootstrap-win.ps1 .venv

      - name: Build Windows environment
        shell: pwsh
        run: ./scripts/build-win.ps1 .venv

      - name: Run Windows verification
        shell: pwsh
        run: |
          ./scripts/test-rust-win.ps1 .venv
          ./scripts/test-python-win.ps1 .venv

      - name: Build Windows wheel artifacts
        shell: pwsh
        run: |
          . .\.venv\Scripts\Activate.ps1
          python -m maturin build --release --out dist

      - name: Upload Windows release candidate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-windows-dist
          path: dist
          if-no-files-found: error

  benchmark-governance:
    needs:
      - release-metadata
    uses: ./.github/workflows/ci-rust-benchmark-governance-smoke.yml
    with:
      target_ref: ${{ inputs.target_ref }}

  finalize-release-candidate:
    runs-on: ubuntu-latest
    needs:
      - release-metadata
      - linux-release-candidate
      - windows-release-candidate
      - benchmark-governance
    steps:
      - name: Download Linux release artifacts
        uses: actions/download-artifact@v5
        with:
          name: release-candidate-linux-dist
          path: release-artifacts/linux

      - name: Download Windows release artifacts
        uses: actions/download-artifact@v5
        with:
          name: release-candidate-windows-dist
          path: release-artifacts/windows

      - name: Write checksums and release summary
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(release-artifacts/linux/* release-artifacts/windows/*)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "no release artifacts were downloaded"
            exit 1
          fi

          sha256sum "${artifacts[@]}" > release-artifacts/SHA256SUMS.txt

          {
            echo "## Release Candidate"
            echo ""
            echo "- Tag: \`${{ inputs.tag_name }}\`"
            echo "- Target ref: \`${{ inputs.target_ref }}\`"
            echo "- Workspace version: \`${{ needs.release-metadata.outputs.workspace_version }}\`"
            echo "- Attached wheel count: \`${#artifacts[@]}\`"
            echo "- Benchmark governance artifacts: uploaded to the workflow run"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(release-artifacts/linux/* release-artifacts/windows/* release-artifacts/SHA256SUMS.txt)

          if gh release view "${{ inputs.tag_name }}" >/dev/null 2>&1; then
            gh release upload "${{ inputs.tag_name }}" "${artifacts[@]}" --clobber
          else
            gh release create "${{ inputs.tag_name }}" "${artifacts[@]}" \
              --draft \
              --title "${{ inputs.tag_name }}" \
              --generate-notes \
              --target "${{ inputs.target_ref }}"
          fi
