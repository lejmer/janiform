  linux-wheel:
    needs: release-source-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TMPDIR: /tmp
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: python -m pip install --upgrade pip uv "maturin>=1.9,<2.0"

      - name: Build Linux wheel and sdist
        run: |
          python -m maturin build --release --locked --out dist
          python -m maturin sdist --out dist

      - name: Check wheel contents
        run: python scripts/ci/check_wheel_contents.py dist/*.whl

      # Release smoke tests run locally for release sign-off.
      # - name: Smoke installed Linux wheel
      #   run: |
      #     python -m venv .wheel-smoke
