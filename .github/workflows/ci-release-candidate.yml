      #       --expected-version "${{ needs.release-source-checks.outputs.version }}"

      - name: Build Linux standalone CLI archive
        run: |
          cargo build --release --locked -p janiform-cli
          python scripts/ci/package_cli_archive.py \
            --binary target/release/janiform \
            --version "${{ needs.release-source-checks.outputs.version }}" \
            --target x86_64-unknown-linux-gnu \
            --output-dir dist

      # - name: Smoke Linux standalone CLI archive
      #   run: python scripts/ci/smoke_cli_archive.py dist/janiform-cli-*.tar.gz

      - name: Upload Linux release candidate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-release-candidate-artifacts
          path: dist
          if-no-files-found: error

  windows-wheel:
    needs: release-source-checks
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
