name: ci-release-candidate

on:
  push:
    branches:
      - "release/v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  release-source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    permissions:
      contents: read
    env:
      TMPDIR: /tmp
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve release version
        id: release-version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          REF_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if [[ "${REF_NAME}" != release/v* ]]; then
            echo "Expected release branch name release/vX.Y.Z, found ${REF_NAME}" >&2
            exit 1
          fi

          echo "version=${REF_NAME#release/v}" >> "$GITHUB_OUTPUT"

      - name: Check source version consistency
        run: python scripts/ci/check_release_version.py --version "${{ steps.release-version.outputs.version }}"

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

