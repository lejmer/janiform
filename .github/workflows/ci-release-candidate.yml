      #     $wheelPath = (Get-ChildItem dist -Filter "*.whl").FullName
      #     uv sync --no-install-project --frozen
      #     .\.wheel-smoke\Scripts\python scripts/ci/smoke_installed_wheel.py `
      #       --wheel $wheelPath `
      #       --no-deps

      - name: Build Windows standalone CLI archive
        shell: pwsh
        run: |
          cargo build --release --locked -p janiform-cli
          python scripts/ci/package_cli_archive.py `
            --binary target/release/janiform.exe `
            --version "${{ needs.release-source-checks.outputs.version }}" `
            --target x86_64-pc-windows-msvc `
            --output-dir dist

      # - name: Smoke Windows standalone CLI archive
