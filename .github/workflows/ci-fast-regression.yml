name: ci-fast-regression

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-deterministic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python CI dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install orjson pytest pytest-benchmark

      - name: Run fast deterministic regression tier
        run: |
          set -o pipefail
          mkdir -p .artifacts/fast-tier
          python3 scripts/ci/run_fast_tier.py --output-dir .artifacts/fast-tier | tee .artifacts/fast-tier/runner-output.log

      - name: Parse fast tier output
        if: always()
        run: |
          python3 scripts/ci/parse_fast_tier_output.py \
            --input-log .artifacts/fast-tier/runner-output.log \
            --output-json .artifacts/fast-tier/parsed_results.json

      - name: Build scenario and baseline links
        if: always()
        run: |
          python3 scripts/ci/write_benchmark_artifact_index.py \
            --output-dir .artifacts/fast-tier \
            --repository "${{ github.repository }}" \
            --git-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --scenario-path "tests/fixtures/benchmarks/benchmark_scenario_catalog.json" \
            --baseline-path "tests/fixtures/benchmarks/oracle_pricer_sufficient_statistics_performance_baseline_v1_1.json"

      - name: Publish fast-tier summary
        if: always()
        run: |
          cat .artifacts/fast-tier/benchmark_artifact_index.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat .artifacts/fast-tier/fast_tier_results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Emit failure context with links
        if: failure()
        run: |
          echo "Fast-tier deterministic regression failed. Scenario and baseline links:"
          cat .artifacts/fast-tier/benchmark_artifact_index.md

      - name: Upload fast-tier artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fast-tier-regression-artifacts
          path: .artifacts/fast-tier
          if-no-files-found: error
