name: ci-generated

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - "release/v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generated-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      TMPDIR: /tmp
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install generated-check dependencies
        run: |
          python -m venv .venv-linux
          ./.venv-linux/bin/python -m pip install --upgrade pip
          ./.venv-linux/bin/python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          subprocess.run(
              [sys.executable, "-m", "pip", "install", *project["dependencies"]],
              check=True,
          )
          PY

      - name: Check generated crate README files
        run: ./.venv-linux/bin/python scripts/generate_crate_readmes.py --check

      - name: Check generated docs references
        run: ./.venv-linux/bin/python scripts/generate_docs_references.py --check

      - name: Check generated internal crate graph policy
        run: ./.venv-linux/bin/python scripts/generate_internal_crate_graph_policy.py --check

      - name: Check generated third-party notices
        run: ./.venv-linux/bin/python scripts/generate_third_party_notices.py --check

      - name: Check generated bundled presets
        run: |
          ./.venv-linux/bin/python scripts/generate_bundled_presets.py
          git diff --exit-code -- python/janiform/calibration/_bundled_presets/generated
