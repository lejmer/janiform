[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "janiform"
description = "Python package and CLI for the Janiform SDE."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "maturin>=1.12.6",
    "numpy>=2.4.3",
    "orjson>=3.11.7",
    "pandas>=3.0.1",
    "plotly>=6.5.0",
    "pyarrow>=23.0.1",
]

[project.optional-dependencies]
test = [
    "matplotlib>=3.10.8",
    "pyqt6==6.10.2",
    "pytest>=8.0",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.0.0",
]
dev = [
    "janiform[test]",
    "databento>=0.74.1",
    "maturin>=1.9,<2.0",
]

[project.scripts]
janiform = "janiform.__main__:main"

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/janiform-pybind/Cargo.toml"
module-name = "janiform._native"
python-source = "python"

[tool.pytest.ini_options]
addopts = [
    "--benchmark-storage=file://./.pytest_cache/benchmark",
]
pythonpath = ["python"]
testpaths = ["tests"]
