[package]
name = "janiform-calibration-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Calibration runtime orchestration for Janiform."
readme = "README.md"
autotests = false

[lib]
name = "janiform_calibration_runtime"
path = "src/lib.rs"
doctest = false

[dependencies]
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
bincode = { workspace = true }
chrono = { workspace = true }
