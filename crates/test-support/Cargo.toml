[package]
name = "janiform-test-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Shared Rust test support for Janiform workspace fixtures."

[lib]
name = "janiform_test_support"
path = "src/lib.rs"
doctest = false

[dependencies]
chrono = { workspace = true }
janiform-market-time = { path = "../market-time" }
janiform-validation = { path = "../validation" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
