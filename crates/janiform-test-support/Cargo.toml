[package]
name = "janiform-test-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Shared Rust test support for Janiform workspace fixtures."
readme = "README.md"

[lib]
name = "janiform_test_support"
path = "src/lib.rs"
doctest = false

[dependencies]
chrono = { workspace = true }
janiform-engine-pricing = { path = "../janiform-engine-pricing" }
janiform-foundations = { path = "../janiform-foundations" }
janiform-market-time = { path = "../janiform-market-time" }
janiform-model-kernels = { path = "../janiform-model-kernels" }
janiform-validation = { path = "../janiform-validation" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
