[package]
name = "janiform-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Core Rust library for Janiform."

[lib]
name = "janiform_core"
path = "src/lib.rs"

[dependencies]
chrono = { workspace = true }
chrono-tz = { workspace = true }
janiform-affine-oracle = { path = "../affine-oracle" }
janiform-calibration-artifacts = { path = "../calibration-artifacts" }
janiform-calibration-runtime = { path = "../calibration-runtime" }
janiform-engine-pricing = { path = "../engine-pricing" }
janiform-engine-risk = { path = "../engine-risk" }
janiform-engine-simulation = { path = "../engine-simulation" }
janiform-foundations = { path = "../foundations" }
janiform-market-time = { path = "../market-time" }
janiform-model-kernels = { path = "../model-kernels" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "rust_microbenchmarks"
harness = false
