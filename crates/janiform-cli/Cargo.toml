[package]
name = "janiform-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native Rust command shell with shared configuration, output, path, and diagnostic boundary for Janiform."
readme = "README.md"

[lib]
name = "janiform_cli"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "janiform"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
clap = { workspace = true }
clap-markdown = { version = "0.1.5", optional = true }
ctrlc = { workspace = true }
janiform = { path = "../janiform" }
janiform-terminal-ui = { path = "../janiform-terminal-ui" }
janiform-event-log = { path = "../janiform-event-log" }
janiform-foundations = { path = "../janiform-foundations" }
janiform-governance = { path = "../janiform-governance" }
janiform-verification = { path = "../janiform-verification" }
janiform-workflows = { path = "../janiform-workflows" }
miette = { version = "7.6.0", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2.0.17"
toml = "0.9.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.22", features = ["fmt", "json"] }

[features]
docs-reference = ["dep:clap-markdown"]

[[bin]]
name = "janiform-cli-docs-reference"
path = "src/tools/docs_reference.rs"
required-features = ["docs-reference"]
