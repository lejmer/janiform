[package]
name = "janiform-verification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Verification and regression domains for Janiform."
readme = "README.md"
autotests = false

[lib]
name = "janiform_verification"
path = "src/lib.rs"
doctest = false

[dependencies]
chrono = { workspace = true }
janiform-affine-oracle = { path = "../janiform-affine-oracle" }
janiform-validation = { path = "../janiform-validation" }
janiform-calibration-artifacts = { path = "../janiform-calibration-artifacts" }
janiform-engine-pricing = { path = "../janiform-engine-pricing" }
janiform-engine-sufficient-statistics = { path = "../janiform-engine-sufficient-statistics" }
janiform-engine-simulation = { path = "../janiform-engine-simulation" }
janiform-foundations = { path = "../janiform-foundations" }
janiform-governance-bench = { path = "../janiform-governance-bench" }
janiform-market-time = { path = "../janiform-market-time" }
janiform-model-kernels = { path = "../janiform-model-kernels" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
janiform-test-support = { path = "../janiform-test-support" }

[[test]]
name = "affine_oracle_solver_consumer_integration"
path = "tests/affine_oracle_solver_consumer_integration.rs"

