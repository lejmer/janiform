[workspace]
members = [
    "crates/janiform-analytics-stylized-facts",
    "crates/janiform-affine-oracle",
    "crates/janiform-calibration-artifacts",
    "crates/janiform-calibration-runtime",
    "crates/janiform",
    "crates/janiform-engine-pricing",
    "crates/janiform-engine-risk",
    "crates/janiform-engine-simulation",
    "crates/janiform-foundations",
    "crates/janiform-governance",
    "crates/janiform-governance-bench",
    "crates/janiform-market-time",
    "crates/janiform-model-kernels",
    "crates/janiform-pybind",
    "crates/janiform-test-support",
    "crates/janiform-validation",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.89"
version = "0.1.0"

[workspace.dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
csv = "1.4.0"
parquet = "56.2.0"
pyo3 = { version = "0.24.2", features = ["abi3-py312", "extension-module"] }
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
statrs = "0.18.0"
