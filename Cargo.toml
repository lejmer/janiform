[workspace]
members = [
    "crates/affine-oracle",
    "crates/core",
    "crates/foundations",
    "crates/model-kernels",
    "crates/pybind",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.89"
version = "0.1.0"

[workspace.dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
pyo3 = { version = "0.24.2", features = ["abi3-py312", "extension-module"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
